<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KlusterFlow: Enterprise Architect</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Google Fonts: Inter + JetBrains Mono -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
    :root {
      --bg-canvas: #f4f4f5; /* Zinc-100 */
      --grid-dot: #d4d4d8;  /* Zinc-300 */
    }

    body { font-family: 'Inter', sans-serif; overflow: hidden; background-color: var(--bg-canvas); color: #18181b; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Lux Glass Panel */
    .glass-panel {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(228, 228, 231, 0.6);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    
    /* Node Styling */
    .node-base {
      transition: box-shadow 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .node-base:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
    }
    .node-selected {
      box-shadow: 0 0 0 2px #2563eb, 0 10px 15px -3px rgba(37, 99, 235, 0.1);
      border-color: #2563eb;
      z-index: 50;
    }

    /* Context Menu */
    .context-menu {
      animation: fadeIn 0.1s ease-out;
      transform-origin: top left;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Selection Box */
    .selection-box {
      border: 1px solid #3b82f6;
      background-color: rgba(59, 130, 246, 0.1);
      pointer-events: none;
      position: absolute;
      z-index: 100;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // --- ICONS ---
    const Icon = ({ name, className, size = "text-lg" }) => {
      const iconMap = {
        'Brain': 'ph-brain', 'Database': 'ph-database', 'Globe': 'ph-globe',
        'Mail': 'ph-envelope', 'Zap': 'ph-lightning', 'FileText': 'ph-file-text',
        'Code': 'ph-code', 'Search': 'ph-magnifying-glass', 'Bot': 'ph-robot',
        'Layers': 'ph-stack', 'ArrowRight': 'ph-arrow-right', 'Sparkles': 'ph-sparkle',
        'Trash2': 'ph-trash', 'X': 'ph-x', 'Maximize2': 'ph-corners-out',
        'Share2': 'ph-share-network', 'Shield': 'ph-shield-check', 'Clock': 'ph-clock',
        'PlayCircle': 'ph-play-circle', 'Terminal': 'ph-terminal-window',
        'ClipboardCheck': 'ph-clipboard-text', 'Download': 'ph-download-simple',
        'FileJson': 'ph-file-json', 'FileCode': 'ph-file-code', 'Loader2': 'ph-spinner',
        'Save': 'ph-floppy-disk', 'Copy': 'ph-copy', 'Plus': 'ph-plus', 'Hand': 'ph-hand-grabbing',
        'Cursor': 'ph-cursor'
      };
      const spinClass = name === 'Loader2' ? 'ph-spin' : '';
      return <i className={`ph ${iconMap[name] || 'ph-circle'} ${spinClass} ${className} ${size}`}></i>;
    };

    // --- CONSTANTS ---
    const SNAP_GRID = 20;
    const CATEGORIES = {
      'Leadership': { bg: 'bg-zinc-800', text: 'text-white', badge: 'bg-zinc-100 text-zinc-600' },
      'Talent':     { bg: 'bg-blue-600', text: 'text-white', badge: 'bg-blue-50 text-blue-600' },
      'Memory':     { bg: 'bg-emerald-600', text: 'text-white', badge: 'bg-emerald-50 text-emerald-600' },
      'Connectors': { bg: 'bg-violet-600', text: 'text-white', badge: 'bg-violet-50 text-violet-600' },
      'Signals':    { bg: 'bg-amber-500', text: 'text-white', badge: 'bg-amber-50 text-amber-600' },
      'Safety':     { bg: 'bg-rose-600', text: 'text-white', badge: 'bg-rose-50 text-rose-600' },
    };

    const TOOLBAR_ITEMS = [
      { type: 'agent-orchestrator', label: 'Team Lead', iconName: 'Brain', category: 'Leadership', desc: 'Manager / Coordinator' },
      { type: 'agent-researcher', label: 'Researcher', iconName: 'Search', category: 'Talent', desc: 'Web & Data Search' },
      { type: 'agent-coder', label: 'Developer', iconName: 'Code', category: 'Talent', desc: 'Code Generation' },
      { type: 'agent-writer', label: 'Copywriter', iconName: 'FileText', category: 'Talent', desc: 'Content Creation' },
      { type: 'tool-db', label: 'Vector DB', iconName: 'Database', category: 'Memory', desc: 'Long-term Recall' },
      { type: 'tool-api', label: 'API Hook', iconName: 'Globe', category: 'Connectors', desc: 'External Request' },
      { type: 'trigger-cron', label: 'Scheduler', iconName: 'Clock', category: 'Signals', desc: 'Time-based Trigger' },
      { type: 'trigger-webhook', label: 'Webhook', iconName: 'Zap', category: 'Signals', desc: 'Event Listener' },
      { type: 'guard-rail', label: 'Guardrail', iconName: 'Shield', category: 'Safety', desc: 'Output Validator' },
      { type: 'output-ui', label: 'Dashboard', iconName: 'Layers', category: 'Connectors', desc: 'User Interface' },
    ];

    const generateId = () => Math.random().toString(36).substr(2, 9);

    // --- COMPONENTS ---

    const ContextMenu = ({ x, y, options, onClose }) => {
      useEffect(() => {
        const handleClickOutside = () => onClose();
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, [onClose]);

      return (
        <div 
          className="context-menu fixed bg-white rounded-lg shadow-xl border border-zinc-200 py-1 min-w-[160px] z-[9999]"
          style={{ top: y, left: x }}
          onMouseDown={(e) => e.stopPropagation()} 
        >
          {options.map((opt, idx) => (
            <button 
              key={idx}
              onClick={(e) => { e.stopPropagation(); opt.action(); onClose(); }}
              className={`w-full text-left px-4 py-2 text-sm flex items-center gap-2 hover:bg-zinc-50 ${opt.danger ? 'text-rose-600 hover:text-rose-700' : 'text-zinc-700'}`}
            >
              {opt.icon && <Icon name={opt.icon} size="text-base" />}
              {opt.label}
            </button>
          ))}
        </div>
      );
    };

    const Connection = ({ from, to, nodes }) => {
      const startNode = nodes.find(n => n.id === from);
      const endNode = nodes.find(n => n.id === to);
      if (!startNode || !endNode) return null;

      const startX = startNode.x + 240; 
      const startY = startNode.y + 40; 
      const endX = endNode.x;         
      const endY = endNode.y + 40;

      const dist = Math.abs(endX - startX);
      const controlOffset = Math.max(dist * 0.4, 60);
      const pathData = `M ${startX} ${startY} C ${startX + controlOffset} ${startY}, ${endX - controlOffset} ${endY}, ${endX} ${endY}`;

      return (
        <g className="group pointer-events-auto">
          {/* Hit area */}
          <path d={pathData} fill="none" stroke="transparent" strokeWidth="20" className="cursor-pointer" />
          {/* Shadow/Outer */}
          <path d={pathData} fill="none" stroke="white" strokeWidth="5" strokeLinecap="round" />
          {/* Main Line */}
          <path 
            d={pathData} 
            fill="none" 
            stroke="#a1a1aa" 
            strokeWidth="2" 
            className="transition-all duration-300 group-hover:stroke-blue-600 group-hover:stroke-[3px]"
            markerEnd="url(#arrowhead)"
          />
        </g>
      );
    };

    const NodeItem = ({ node, isSelected, onMouseDown, onHandleMouseDown, onContextMenu }) => {
      const config = TOOLBAR_ITEMS.find(t => t.type === node.type) || {};
      const theme = CATEGORIES[config.category] || CATEGORIES['Leadership'];

      return (
        <div
          className={`absolute w-60 rounded-lg flex flex-col bg-white select-none node-base ${isSelected ? 'node-selected' : 'border border-zinc-200'}`}
          style={{ left: node.x, top: node.y }}
          onMouseDown={(e) => onMouseDown(e, node.id)}
          onContextMenu={(e) => onContextMenu(e, node.id)}
        >
          {/* Header */}
          <div className="p-3 border-b border-zinc-100 flex items-center gap-3">
            <div className={`w-8 h-8 rounded-md ${theme.bg} ${theme.text} flex items-center justify-center shadow-sm`}>
              <Icon name={config.iconName} />
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">{config.category}</div>
              <div className="font-semibold text-zinc-900 text-sm truncate">{node.label}</div>
            </div>
          </div>

          {/* Body */}
          <div className="p-3 min-h-[60px] max-h-[120px] overflow-hidden group-hover:overflow-y-auto">
            <p className="text-xs text-zinc-500 font-medium leading-relaxed font-mono">
              {node.data.purpose || <span className="opacity-50 italic">System prompt empty...</span>}
            </p>
          </div>

          {/* Connect Handle */}
          <div 
            className="absolute -right-2.5 top-8 w-5 h-5 bg-white border border-zinc-300 rounded-full cursor-crosshair 
            opacity-0 group-hover:opacity-100 hover:scale-125 hover:border-blue-500 hover:bg-blue-50 transition-all 
            shadow-sm flex items-center justify-center z-50"
            onMouseDown={(e) => onHandleMouseDown(e, node.id)}
          >
            <div className="w-1.5 h-1.5 bg-blue-600 rounded-full" />
          </div>
        </div>
      );
    };

    // --- MAIN APP ---

    const AgentFlowStudio = () => {
      // Data State
      const [nodes, setNodes] = useState([
        { id: '1', type: 'agent-orchestrator', x: 400, y: 150, label: 'Team Lead', data: { purpose: 'Oversee project lifecycle.' } },
        { id: '2', type: 'agent-researcher', x: 180, y: 380, label: 'Researcher', data: { purpose: 'Data acquisition.' } },
      ]);
      const [edges, setEdges] = useState([{ id: 'e1-2', from: '1', to: '2' }]);
      
      // UI State
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [viewOffset, setViewOffset] = useState({ x: 0, y: 0 });
      const [dragState, setDragState] = useState({ isDragging: false, type: null });
      const [selectionBox, setSelectionBox] = useState(null);
      const [contextMenu, setContextMenu] = useState(null);
      const [isSpacePressed, setIsSpacePressed] = useState(false);

      const canvasRef = useRef(null);

      // --- HELPERS ---
      const deleteNodes = (idsToDelete) => {
        const ids = new Set(idsToDelete);
        setNodes(ns => ns.filter(n => !ids.has(n.id)));
        setEdges(es => es.filter(e => !ids.has(e.from) && !ids.has(e.to)));
        setSelectedIds(prev => {
          const next = new Set(prev);
          ids.forEach(id => next.delete(id));
          return next;
        });
      };

      const duplicateNodes = (idsToDup) => {
        const newNodes = [];
        const idMap = {};
        
        nodes.forEach(n => {
          if (idsToDup.has(n.id)) {
            const newId = generateId();
            idMap[n.id] = newId;
            newNodes.push({ ...n, id: newId, x: n.x + 40, y: n.y + 40, label: `${n.label} (Copy)` });
          }
        });

        setNodes(prev => [...prev, ...newNodes]);
        // Select new nodes
        setSelectedIds(new Set(newNodes.map(n => n.id)));
      };

      // --- EVENTS ---
      
      // Track Spacebar for Panning
      useEffect(() => {
        const handleKeyDown = (e) => { if (e.code === 'Space' && !e.repeat) setIsSpacePressed(true); };
        const handleKeyUp = (e) => { if (e.code === 'Space') setIsSpacePressed(false); };
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => { window.removeEventListener('keydown', handleKeyDown); window.removeEventListener('keyup', handleKeyUp); };
      }, []);

      const handleContextMenu = (e, type, id) => {
        e.preventDefault();
        const options = [];
        
        if (type === 'node') {
          // Select the node if not already selected
          if (!selectedIds.has(id)) setSelectedIds(new Set([id]));
          
          options.push({ label: 'Duplicate', icon: 'Copy', action: () => duplicateNodes(selectedIds.has(id) ? selectedIds : new Set([id])) });
          options.push({ label: 'Delete', icon: 'Trash2', danger: true, action: () => deleteNodes(selectedIds.has(id) ? selectedIds : [id]) });
        } else {
          options.push({ label: 'Reset View', icon: 'Maximize2', action: () => setViewOffset({ x: 0, y: 0 }) });
          options.push({ label: 'Paste (Mock)', icon: 'ClipboardCheck', action: () => alert('Paste logic here') });
        }

        setContextMenu({ x: e.clientX, y: e.clientY, options });
      };

      const handleMouseDown = (e, type, id = null) => {
        if (e.button !== 0) return; // Only left click
        setContextMenu(null); // Close context menu
        e.stopPropagation();

        const startX = e.clientX;
        const startY = e.clientY;
        
        if (type === 'canvas') {
          if (isSpacePressed) {
            // Panning
            setDragState({ isDragging: true, type: 'pan', startX, startY, initX: viewOffset.x, initY: viewOffset.y });
          } else {
            // Lasso Selection
            const rect = canvasRef.current.getBoundingClientRect();
            setDragState({ isDragging: true, type: 'lasso', startX: e.clientX - rect.left, startY: e.clientY - rect.top });
            setSelectionBox({ x: e.clientX - rect.left, y: e.clientY - rect.top, w: 0, h: 0 });
            setSelectedIds(new Set()); // Clear selection on new lasso
          }
        } else if (type === 'node') {
          // Node Selection Logic
          let newSelection = new Set(selectedIds);
          if (e.shiftKey) {
            if (newSelection.has(id)) newSelection.delete(id);
            else newSelection.add(id);
          } else {
            if (!newSelection.has(id)) newSelection = new Set([id]);
          }
          setSelectedIds(newSelection);

          // Prepare Dragging for ALL selected nodes
          const initialPositions = {};
          nodes.forEach(n => {
            if (newSelection.has(n.id)) initialPositions[n.id] = { x: n.x, y: n.y };
          });

          setDragState({ isDragging: true, type: 'nodes', startX, startY, initialPositions });
        } else if (type === 'connection') {
           const n = nodes.find(n => n.id === id);
           setDragState({ isDragging: true, type: 'connection', from: id, startX: n.x + 240, startY: n.y + 40, currX: n.x + 240, currY: n.y + 40 });
        }
      };

      const handleMouseMove = useCallback((e) => {
        if (!dragState.isDragging) return;
        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;

        if (dragState.type === 'pan') {
          setViewOffset({ x: dragState.initX + dx, y: dragState.initY + dy });
        } 
        else if (dragState.type === 'nodes') {
          setNodes(prev => prev.map(n => {
             if (dragState.initialPositions[n.id]) {
               const rawX = dragState.initialPositions[n.id].x + dx;
               const rawY = dragState.initialPositions[n.id].y + dy;
               return { ...n, x: Math.round(rawX / SNAP_GRID) * SNAP_GRID, y: Math.round(rawY / SNAP_GRID) * SNAP_GRID };
             }
             return n;
          }));
        } 
        else if (dragState.type === 'lasso') {
           const rect = canvasRef.current.getBoundingClientRect();
           const currentX = e.clientX - rect.left;
           const currentY = e.clientY - rect.top;
           const newBox = {
             x: Math.min(dragState.startX, currentX),
             y: Math.min(dragState.startY, currentY),
             w: Math.abs(currentX - dragState.startX),
             h: Math.abs(currentY - dragState.startY)
           };
           setSelectionBox(newBox);
           
           // Live Selection Update
           const relativeBox = {
             x: newBox.x - viewOffset.x,
             y: newBox.y - viewOffset.y,
             w: newBox.w,
             h: newBox.h
           };

           const nextSelected = new Set();
           nodes.forEach(n => {
             // Simple interaction check (center point or intersection)
             // Checking if node center is inside selection box
             const centerX = n.x + 120; // Approx center
             const centerY = n.y + 50; 
             if (centerX >= relativeBox.x && centerX <= relativeBox.x + relativeBox.w &&
                 centerY >= relativeBox.y && centerY <= relativeBox.y + relativeBox.h) {
               nextSelected.add(n.id);
             }
           });
           setSelectedIds(nextSelected);
        }
        else if (dragState.type === 'connection' && canvasRef.current) {
           const rect = canvasRef.current.getBoundingClientRect();
           setDragState(prev => ({ ...prev, currX: e.clientX - rect.left - viewOffset.x, currY: e.clientY - rect.top - viewOffset.y }));
        }
      }, [dragState, nodes, viewOffset]);

      const handleMouseUp = (e) => {
        if (!dragState.isDragging) return;
        
        if (dragState.type === 'connection') {
           const rect = canvasRef.current.getBoundingClientRect();
           const mx = e.clientX - rect.left - viewOffset.x;
           const my = e.clientY - rect.top - viewOffset.y;
           const target = nodes.find(n => mx >= n.x && mx <= n.x + 240 && my >= n.y && my <= n.y + 100);
           if (target && target.id !== dragState.from) {
             if (!edges.some(edge => edge.from === dragState.from && edge.to === target.id)) {
               setEdges(eds => [...eds, { id: generateId(), from: dragState.from, to: target.id }]);
             }
           }
        }

        setDragState({ isDragging: false, type: null });
        setSelectionBox(null);
      };

      // --- EXPORT LOGIC ---
      const downloadJSON = () => {
        const json = JSON.stringify({ nodes, edges, version: '2.0-pro' }, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agentflow_pro.json'; a.click();
      };

      const downloadCode = () => {
        const pyCode = `# AgentFlow Enterprise Export\n# Generated: ${new Date().toISOString()}\n\ndef workflow_engine():\n    pass`;
        const blob = new Blob([pyCode], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'workflow_pro.py'; a.click();
      };

      // --- RENDER ---
      return (
        <div 
          className="flex h-screen w-full select-none"
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
        >
          {/* SIDEBAR */}
          <div className="w-64 glass-panel z-40 flex flex-col border-r border-zinc-200 shadow-xl">
            <div className="p-5 border-b border-zinc-100">
               <div className="flex items-center gap-2 text-zinc-900 mb-1">
                 <div className="p-1.5 bg-zinc-900 rounded text-white"><Icon name="Brain" size="text-lg" /></div>
                 <h1 className="text-lg font-bold tracking-tight">KlusterFlow</h1>
               </div>
               <p className="text-[10px] font-medium text-zinc-400 uppercase tracking-widest pl-1">Enterprise Edition</p>
            </div>
            
            <div className="flex-1 overflow-y-auto p-4 space-y-8 custom-scrollbar">
              {Object.entries(CATEGORIES).map(([cat, style]) => (
                <div key={cat}>
                  <div className="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mb-3 pl-2">{cat}</div>
                  <div className="space-y-1.5">
                    {TOOLBAR_ITEMS.filter(i => i.category === cat).map(item => (
                      <div 
                        key={item.type}
                        draggable
                        onDragStart={(e) => e.dataTransfer.setData('type', item.type)}
                        className="flex items-center p-2.5 rounded-md border border-transparent hover:border-zinc-200 hover:bg-white hover:shadow-sm cursor-grab active:cursor-grabbing transition-all group"
                      >
                        <div className={`p-1.5 rounded-md ${style.badge} group-hover:bg-zinc-800 group-hover:text-white transition-colors`}>
                          <Icon name={item.iconName} size="text-sm" />
                        </div>
                        <div className="ml-3">
                          <div className="text-xs font-bold text-zinc-600 group-hover:text-zinc-900">{item.label}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* CANVAS AREA */}
          <div className="flex-1 relative overflow-hidden bg-zinc-50">
            {/* Toolbar */}
            <div className="absolute top-4 right-4 z-50 flex gap-2">
              <div className="bg-white rounded-lg shadow-lg border border-zinc-200 p-1 flex gap-1 items-center">
                 <div className="px-3 py-1.5 text-xs font-semibold text-zinc-400 flex items-center gap-2 border-r border-zinc-100">
                   <Icon name={isSpacePressed ? 'Hand' : 'Cursor'} />
                   {isSpacePressed ? 'Pan Mode' : 'Select Mode'}
                 </div>
                 <button onClick={downloadJSON} className="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-zinc-700 hover:bg-zinc-50 rounded-md transition-colors">
                   <Icon name="FileJson" /> Export JSON
                 </button>
                 <button onClick={downloadCode} className="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-white bg-zinc-900 hover:bg-zinc-800 rounded-md shadow-sm transition-all">
                   <Icon name="FileCode" /> Generate Code
                 </button>
              </div>
            </div>

            {/* Canvas */}
            <div 
              ref={canvasRef}
              className={`w-full h-full relative ${isSpacePressed ? 'cursor-grab active:cursor-grabbing' : 'cursor-default'}`}
              onMouseDown={(e) => handleMouseDown(e, 'canvas')}
              onContextMenu={(e) => handleContextMenu(e, 'canvas')}
              onDragOver={(e) => e.preventDefault()}
              onDrop={(e) => {
                 const type = e.dataTransfer.getData('type');
                 if (!type) return;
                 const rect = canvasRef.current.getBoundingClientRect();
                 const x = e.clientX - rect.left - viewOffset.x - 120;
                 const y = e.clientY - rect.top - viewOffset.y - 40;
                 setNodes(ns => [...ns, { id: generateId(), type, x, y, label: TOOLBAR_ITEMS.find(t=>t.type===type).label, data: { purpose: '' }}]);
              }}
            >
              {/* Grid */}
              <div 
                className="absolute inset-0 pointer-events-none opacity-[0.3]" 
                style={{ 
                  backgroundImage: 'radial-gradient(var(--grid-dot) 1px, transparent 1px)', 
                  backgroundSize: `${SNAP_GRID}px ${SNAP_GRID}px`,
                  backgroundPosition: `${viewOffset.x}px ${viewOffset.y}px`
                }} 
              />
              
              {/* Nodes Layer */}
              <div style={{ transform: `translate(${viewOffset.x}px, ${viewOffset.y}px)` }} className="w-full h-full relative">
                 <svg className="absolute overflow-visible pointer-events-none w-full h-full" style={{ left: 0, top: 0 }}>
                   <defs>
                     <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                       <polygon points="0 0, 10 3.5, 0 7" fill="#a1a1aa" />
                     </marker>
                   </defs>
                   {edges.map(e => <Connection key={e.id} {...e} nodes={nodes} />)}
                   {dragState.type === 'connection' && (
                     <path 
                       d={`M ${dragState.startX} ${dragState.startY} C ${dragState.startX + 50} ${dragState.startY}, ${dragState.currX - 50} ${dragState.currY}, ${dragState.currX} ${dragState.currY}`} 
                       fill="none" stroke="#2563eb" strokeWidth="2" strokeDasharray="5,5" className="animate-pulse"
                     />
                   )}
                 </svg>
  
                 {nodes.map(n => (
                   <NodeItem 
                     key={n.id} 
                     node={n} 
                     isSelected={selectedIds.has(n.id)}
                     onMouseDown={(e) => handleMouseDown(e, 'node', n.id)} 
                     onContextMenu={(e) => handleContextMenu(e, 'node', n.id)}
                     onHandleMouseDown={(e) => handleMouseDown(e, 'connection', n.id)}
                   />
                 ))}
              </div>

              {/* Selection Box Render */}
              {selectionBox && (
                <div 
                  className="selection-box rounded-sm"
                  style={{ 
                    left: selectionBox.x, 
                    top: selectionBox.y, 
                    width: selectionBox.w, 
                    height: selectionBox.h 
                  }}
                />
              )}
            </div>
          </div>

          {/* INSPECTOR PANEL (Right) */}
          {selectedIds.size === 1 && (
            <div className="w-80 glass-panel z-40 border-l border-zinc-200 flex flex-col animate-in slide-in-from-right duration-200">
               {(() => {
                 const node = nodes.find(n => n.id === Array.from(selectedIds)[0]);
                 if (!node) return null;
                 return (
                   <>
                     <div className="p-4 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
                       <span className="font-bold text-zinc-900 text-sm">Properties</span>
                       <button onClick={() => setSelectedIds(new Set())}><Icon name="X" className="text-zinc-400 hover:text-zinc-600" /></button>
                     </div>
                     <div className="p-5 space-y-6">
                       <div>
                         <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Agent Name</label>
                         <input 
                           value={node.label} 
                           onChange={(e) => setNodes(ns => ns.map(n => n.id === node.id ? { ...n, label: e.target.value } : n))}
                           className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-zinc-800" 
                         />
                       </div>
                       <div>
                         <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-2">Instructions</label>
                         <textarea 
                           value={node.data.purpose}
                           onChange={(e) => setNodes(ns => ns.map(n => n.id === node.id ? { ...n, data: { ...n.data, purpose: e.target.value } } : n))}
                           rows={8}
                           className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-lg text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all resize-none text-zinc-700 font-mono"
                           placeholder="Enter system prompt..."
                         />
                       </div>
                       <button 
                         onClick={() => deleteNodes([node.id])}
                         className="w-full py-2.5 bg-white border border-rose-200 text-rose-600 rounded-lg text-sm font-bold hover:bg-rose-50 hover:border-rose-300 transition-all flex items-center justify-center gap-2 shadow-sm"
                       >
                         <Icon name="Trash2" /> Delete Agent
                       </button>
                     </div>
                   </>
                 );
               })()}
            </div>
          )}

          {/* Global Context Menu */}
          {contextMenu && (
            <ContextMenu 
              x={contextMenu.x} 
              y={contextMenu.y} 
              options={contextMenu.options} 
              onClose={() => setContextMenu(null)} 
            />
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AgentFlowStudio />);
  </script>
</body>
</html>
