<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KlusterFlow: Enterprise Lux v2</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Configuration for Tailwind Dark Mode -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            // Lux Zinc Scale
            canvas: { light: '#f4f4f5', dark: '#09090b' },
            panel:  { light: 'rgba(255, 255, 255, 0.95)', dark: 'rgba(24, 24, 27, 0.8)' },
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
    body { 
      font-family: 'Inter', sans-serif; 
      overflow: hidden; 
      transition: background-color 0.3s ease;
    }

    /* Glassmorphism */
    .glass {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Animations */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .slide-in { animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #a1a1aa; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #71717a; }
    
    .dark ::-webkit-scrollbar-thumb { background: #52525b; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #71717a; }
  </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 selection:bg-indigo-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback, useMemo } = React;

    // --- ICONS WRAPPER ---
    const Icon = ({ name, className = "", size = "text-lg", weight = "regular" }) => {
      const iconMap = {
        'Brain': 'ph-brain', 'Database': 'ph-database', 'Globe': 'ph-globe',
        'Mail': 'ph-envelope', 'Zap': 'ph-lightning', 'FileText': 'ph-file-text',
        'Code': 'ph-code', 'Search': 'ph-magnifying-glass', 'Bot': 'ph-robot',
        'Layers': 'ph-stack', 'ArrowRight': 'ph-arrow-right', 'Sparkles': 'ph-sparkle',
        'Trash2': 'ph-trash', 'X': 'ph-x', 'Maximize2': 'ph-corners-out',
        'Share2': 'ph-share-network', 'Shield': 'ph-shield-check', 'Clock': 'ph-clock',
        'PlayCircle': 'ph-play-circle', 'Terminal': 'ph-terminal-window',
        'ClipboardCheck': 'ph-clipboard-text', 'Download': 'ph-download-simple',
        'FileJson': 'ph-file-json', 'FileCode': 'ph-file-code', 'Loader2': 'ph-spinner',
        'Save': 'ph-floppy-disk', 'Copy': 'ph-copy', 'Plus': 'ph-plus', 'Hand': 'ph-hand-grabbing',
        'Cursor': 'ph-cursor', 'Moon': 'ph-moon', 'Sun': 'ph-sun', 'Gear': 'ph-gear',
        'DotsThree': 'ph-dots-three-vertical', 'Check': 'ph-check'
      };
      const spinClass = name === 'Loader2' ? 'ph-spin' : '';
      return <i className={`ph ${iconMap[name] || 'ph-circle'} ${spinClass} ${className} ${size} font-${weight}`}></i>;
    };

    // --- CONSTANTS ---
    const SNAP_GRID = 20;
    
    // Lux Color Palette (Dark/Light compatible)
    const CATEGORIES = {
      'Leadership': { 
        light: 'bg-zinc-800 text-white', 
        dark: 'dark:bg-zinc-200 dark:text-zinc-900',
        badge_light: 'bg-zinc-100 text-zinc-600',
        badge_dark: 'dark:bg-zinc-800 dark:text-zinc-300'
      },
      'Talent': { 
        light: 'bg-indigo-600 text-white', 
        dark: 'dark:bg-indigo-500 dark:text-white',
        badge_light: 'bg-indigo-50 text-indigo-600',
        badge_dark: 'dark:bg-indigo-900/50 dark:text-indigo-300'
      },
      'Memory': { 
        light: 'bg-emerald-600 text-white', 
        dark: 'dark:bg-emerald-500 dark:text-white',
        badge_light: 'bg-emerald-50 text-emerald-600',
        badge_dark: 'dark:bg-emerald-900/50 dark:text-emerald-300'
      },
      'Connectors': { 
        light: 'bg-violet-600 text-white', 
        dark: 'dark:bg-violet-500 dark:text-white',
        badge_light: 'bg-violet-50 text-violet-600',
        badge_dark: 'dark:bg-violet-900/50 dark:text-violet-300'
      },
      'Signals': { 
        light: 'bg-amber-500 text-white', 
        dark: 'dark:bg-amber-500 dark:text-white',
        badge_light: 'bg-amber-50 text-amber-600',
        badge_dark: 'dark:bg-amber-900/50 dark:text-amber-300'
      },
      'Safety': { 
        light: 'bg-rose-600 text-white', 
        dark: 'dark:bg-rose-500 dark:text-white',
        badge_light: 'bg-rose-50 text-rose-600',
        badge_dark: 'dark:bg-rose-900/50 dark:text-rose-300'
      },
    };

    const TOOLBAR_ITEMS = [
      { type: 'agent-orchestrator', label: 'Team Lead', iconName: 'Brain', category: 'Leadership' },
      { type: 'agent-researcher', label: 'Researcher', iconName: 'Search', category: 'Talent' },
      { type: 'agent-coder', label: 'Developer', iconName: 'Code', category: 'Talent' },
      { type: 'agent-writer', label: 'Copywriter', iconName: 'FileText', category: 'Talent' },
      { type: 'tool-db', label: 'Vector DB', iconName: 'Database', category: 'Memory' },
      { type: 'tool-api', label: 'API Hook', iconName: 'Globe', category: 'Connectors' },
      { type: 'trigger-cron', label: 'Scheduler', iconName: 'Clock', category: 'Signals' },
      { type: 'trigger-webhook', label: 'Webhook', iconName: 'Zap', category: 'Signals' },
      { type: 'guard-rail', label: 'Guardrail', iconName: 'Shield', category: 'Safety' },
      { type: 'output-ui', label: 'Dashboard', iconName: 'Layers', category: 'Connectors' },
    ];

    const generateId = () => Math.random().toString(36).substr(2, 9);

    // --- COMPONENTS ---

    const Connection = ({ from, to, nodes, isDark }) => {
      const startNode = nodes.find(n => n.id === from);
      const endNode = nodes.find(n => n.id === to);
      if (!startNode || !endNode) return null;

      const startX = startNode.x + 240; 
      const startY = startNode.y + 40; 
      const endX = endNode.x;         
      const endY = endNode.y + 40;

      const dist = Math.abs(endX - startX);
      const controlOffset = Math.max(dist * 0.5, 60);
      const pathData = `M ${startX} ${startY} C ${startX + controlOffset} ${startY}, ${endX - controlOffset} ${endY}, ${endX} ${endY}`;

      const strokeColor = isDark ? "#71717a" : "#a1a1aa"; // Zinc-500 / Zinc-400
      
      return (
        <g className="group pointer-events-auto">
          {/* Hit area */}
          <path d={pathData} fill="none" stroke="transparent" strokeWidth="20" className="cursor-pointer" />
          {/* Main Line */}
          <path 
            d={pathData} 
            fill="none" 
            stroke={strokeColor}
            strokeWidth="2" 
            className="transition-all duration-300 group-hover:stroke-indigo-500 group-hover:stroke-[3px]"
            markerEnd="url(#arrowhead)"
          />
        </g>
      );
    };

    const NodeItem = ({ node, isSelected, onMouseDown, onHandleMouseDown, onContextMenu }) => {
      const config = TOOLBAR_ITEMS.find(t => t.type === node.type) || {};
      const cat = CATEGORIES[config.category] || CATEGORIES['Leadership'];

      return (
        <div
          className={`absolute w-60 rounded-xl flex flex-col select-none transition-all duration-200
            ${isSelected ? 'ring-2 ring-indigo-500 shadow-xl z-30' : 'border border-zinc-200 dark:border-zinc-800 shadow-sm hover:shadow-md z-20'}
            bg-white dark:bg-zinc-900`}
          style={{ left: node.x, top: node.y }}
          onMouseDown={(e) => onMouseDown(e, node.id)}
          onContextMenu={(e) => onContextMenu(e, node.id)}
        >
          {/* Header */}
          <div className="p-3 border-b border-zinc-100 dark:border-zinc-800 flex items-center gap-3">
            <div className={`w-8 h-8 rounded-lg flex items-center justify-center shadow-sm ${cat.light} ${cat.dark}`}>
              <Icon name={config.iconName} />
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">{config.category}</div>
              <div className="font-semibold text-zinc-900 dark:text-zinc-100 text-sm truncate">{node.label}</div>
            </div>
          </div>

          {/* Body */}
          <div className="p-3 min-h-[60px] max-h-[120px] overflow-hidden group-hover:overflow-y-auto">
            <p className="text-xs text-zinc-500 dark:text-zinc-400 font-medium leading-relaxed font-mono">
              {node.data.purpose || <span className="opacity-40 italic">System prompt empty...</span>}
            </p>
          </div>

          {/* Connect Handle */}
          <div 
            className="absolute -right-2.5 top-9 w-5 h-5 bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-600 rounded-full cursor-crosshair 
            opacity-0 group-hover:opacity-100 hover:scale-125 hover:border-indigo-500 hover:bg-indigo-50 transition-all 
            shadow-sm flex items-center justify-center z-50"
            onMouseDown={(e) => onHandleMouseDown(e, node.id)}
          >
            <div className="w-1.5 h-1.5 bg-indigo-500 rounded-full" />
          </div>
        </div>
      );
    };

    const ContextMenu = ({ x, y, options, onClose }) => {
      // Close on click outside
      useEffect(() => {
        const handler = () => onClose();
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
      }, [onClose]);

      return (
        <div 
          className="fixed bg-white dark:bg-zinc-900 rounded-lg shadow-2xl border border-zinc-200 dark:border-zinc-700 py-1 min-w-[180px] z-[9999] context-menu"
          style={{ top: y, left: x }}
          onMouseDown={(e) => e.stopPropagation()} 
        >
          {options.map((opt, idx) => (
            <button 
              key={idx}
              onClick={(e) => { e.stopPropagation(); opt.action(); onClose(); }}
              className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-3 hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-colors
                ${opt.danger ? 'text-rose-600 hover:text-rose-700' : 'text-zinc-700 dark:text-zinc-200'}`}
            >
              {opt.icon && <Icon name={opt.icon} size="text-lg" />}
              {opt.label}
            </button>
          ))}
        </div>
      );
    };

    // --- MAIN APP ---

    const App = () => {
      // --- STATE ---
      const [isDark, setIsDark] = useState(false);
      const [nodes, setNodes] = useState([
        { id: '1', type: 'agent-orchestrator', x: 400, y: 150, label: 'Team Lead', data: { purpose: 'Oversee project lifecycle.' } },
        { id: '2', type: 'agent-researcher', x: 180, y: 380, label: 'Researcher', data: { purpose: 'Data acquisition.' } },
      ]);
      const [edges, setEdges] = useState([{ id: 'e1-2', from: '1', to: '2' }]);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [viewOffset, setViewOffset] = useState({ x: 0, y: 0 });
      const [dragState, setDragState] = useState({ isDragging: false, type: null });
      const [selectionBox, setSelectionBox] = useState(null);
      const [contextMenu, setContextMenu] = useState(null);
      const [isSpacePressed, setIsSpacePressed] = useState(false);
      
      const canvasRef = useRef(null);

      // --- THEME ---
      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      // --- KEYBOARD ---
      useEffect(() => {
        const down = (e) => { 
          if (e.code === 'Space' && !e.repeat) setIsSpacePressed(true); 
          if (e.key === 'Delete' || e.key === 'Backspace') {
             if (selectedIds.size > 0) deleteNodes(selectedIds);
          }
        };
        const up = (e) => { if (e.code === 'Space') setIsSpacePressed(false); };
        window.addEventListener('keydown', down);
        window.addEventListener('keyup', up);
        return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
      }, [selectedIds]);

      // --- ACTIONS ---
      const deleteNodes = (ids) => {
        setNodes(ns => ns.filter(n => !ids.has(n.id)));
        setEdges(es => es.filter(e => !ids.has(e.from) && !ids.has(e.to)));
        setSelectedIds(new Set());
      };

      const duplicateNodes = (ids) => {
        const newNodes = [];
        nodes.forEach(n => {
          if (ids.has(n.id)) {
            newNodes.push({ ...n, id: generateId(), x: n.x + 30, y: n.y + 30, label: `${n.label} (Copy)` });
          }
        });
        setNodes(prev => [...prev, ...newNodes]);
      };

      // --- EXPORTS ---
      const downloadJSON = () => {
        const json = JSON.stringify({ nodes, edges, version: '2.1' }, null, 2);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = `agentflow_export_${Date.now()}.json`;
        a.click();
      };
      
      const downloadCode = () => {
        const code = `# AgentFlow Export\n# Generated at ${new Date().toISOString()}\n\nimport os\n\ndef main():\n    print("Workflow initialized...")\n`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
        a.download = `workflow.py`;
        a.click();
      };

      // --- DRAG LOGIC ---
      const handleMouseDown = (e, type, id = null) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        setContextMenu(null);

        const rect = canvasRef.current.getBoundingClientRect();
        const ex = e.clientX - rect.left;
        const ey = e.clientY - rect.top;

        if (type === 'canvas') {
          if (isSpacePressed) {
            setDragState({ isDragging: true, type: 'pan', startX: e.clientX, startY: e.clientY, initX: viewOffset.x, initY: viewOffset.y });
          } else {
            setDragState({ isDragging: true, type: 'lasso', startX: ex, startY: ey });
            setSelectionBox({ x: ex, y: ey, w: 0, h: 0 });
            setSelectedIds(new Set());
          }
        } else if (type === 'node') {
          let newSel = new Set(selectedIds);
          if (e.shiftKey) {
            newSel.has(id) ? newSel.delete(id) : newSel.add(id);
          } else {
            if (!newSel.has(id)) newSel = new Set([id]);
          }
          setSelectedIds(newSel);
          
          const posMap = {};
          nodes.forEach(n => { if (newSel.has(n.id)) posMap[n.id] = { x: n.x, y: n.y }; });
          setDragState({ isDragging: true, type: 'nodes', startX: e.clientX, startY: e.clientY, posMap });
        } else if (type === 'connection') {
          const n = nodes.find(n => n.id === id);
          // Set start pos relative to node connector
          const startX = n.x + 240;
          const startY = n.y + 40;
          
          setDragState({ 
            isDragging: true, 
            type: 'connection', 
            from: id, 
            startX, 
            startY, 
            currX: startX, 
            currY: startY 
          });
        }
      };

      const handleMouseMove = (e) => {
        if (!dragState.isDragging) return;
        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;

        if (dragState.type === 'pan') {
          setViewOffset({ x: dragState.initX + dx, y: dragState.initY + dy });
        } else if (dragState.type === 'nodes') {
          setNodes(prev => prev.map(n => {
            if (dragState.posMap[n.id]) {
               const rawX = dragState.posMap[n.id].x + dx;
               const rawY = dragState.posMap[n.id].y + dy;
               return { ...n, x: Math.round(rawX / SNAP_GRID) * SNAP_GRID, y: Math.round(rawY / SNAP_GRID) * SNAP_GRID };
            }
            return n;
          }));
        } else if (dragState.type === 'lasso') {
           const rect = canvasRef.current.getBoundingClientRect();
           const curX = e.clientX - rect.left;
           const curY = e.clientY - rect.top;
           
           const newBox = {
             x: Math.min(dragState.startX, curX),
             y: Math.min(dragState.startY, curY),
             w: Math.abs(curX - dragState.startX),
             h: Math.abs(curY - dragState.startY)
           };
           setSelectionBox(newBox);
           
           const sel = new Set();
           const relX = newBox.x - viewOffset.x;
           const relY = newBox.y - viewOffset.y;
           
           nodes.forEach(n => {
             const cx = n.x + 120; 
             const cy = n.y + 50;
             if (cx >= relX && cx <= relX + newBox.w && cy >= relY && cy <= relY + newBox.h) {
               sel.add(n.id);
             }
           });
           setSelectedIds(sel);
        } else if (dragState.type === 'connection') {
           const rect = canvasRef.current.getBoundingClientRect();
           // Update currX/currY relative to canvas viewOffset
           const mouseX = e.clientX - rect.left - viewOffset.x;
           const mouseY = e.clientY - rect.top - viewOffset.y;
           setDragState(prev => ({ ...prev, currX: mouseX, currY: mouseY }));
        }
      };

      const handleMouseUp = (e) => {
        if (!dragState.isDragging) return;
        if (dragState.type === 'connection') {
           const rect = canvasRef.current.getBoundingClientRect();
           const mx = e.clientX - rect.left - viewOffset.x;
           const my = e.clientY - rect.top - viewOffset.y;
           
           // Hit detection for any node
           const target = nodes.find(n => mx >= n.x && mx <= n.x + 240 && my >= n.y && my <= n.y + 100);
           
           if (target && target.id !== dragState.from) {
             // Prevent duplicates
             if (!edges.some(edge => edge.from === dragState.from && edge.to === target.id)) {
               setEdges(prev => [...prev, { id: generateId(), from: dragState.from, to: target.id }]);
             }
           }
        }
        setDragState({ isDragging: false, type: null });
        setSelectionBox(null);
      };

      const onContextMenu = (e, type, id) => {
        e.preventDefault();
        const options = [];
        if (type === 'node') {
           if (!selectedIds.has(id)) setSelectedIds(new Set([id]));
           const targetIds = selectedIds.has(id) ? selectedIds : new Set([id]);
           
           options.push({ label: 'Duplicate Node', icon: 'Copy', action: () => duplicateNodes(targetIds) });
           options.push({ label: 'Delete', icon: 'Trash2', danger: true, action: () => deleteNodes(targetIds) });
        } else {
           options.push({ label: 'Reset View', icon: 'Maximize2', action: () => setViewOffset({ x: 0, y: 0 }) });
           options.push({ label: 'New Agent', icon: 'Plus', action: () => {
             const rect = canvasRef.current.getBoundingClientRect();
             const x = e.clientX - rect.left - viewOffset.x;
             const y = e.clientY - rect.top - viewOffset.y;
             setNodes(prev => [...prev, { id: generateId(), type: 'agent-orchestrator', x, y, label: 'New Agent', data: { purpose: '' }}]);
           }});
        }
        setContextMenu({ x: e.clientX, y: e.clientY, options });
      };

      return (
        <div className="flex h-screen w-full bg-zinc-50 dark:bg-zinc-950 overflow-hidden" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}>
          
          {/* LEFT SIDEBAR */}
          <div className="w-64 glass border-r border-zinc-200 dark:border-zinc-800 z-40 flex flex-col bg-white/80 dark:bg-zinc-900/80">
            <div className="p-4 border-b border-zinc-100 dark:border-zinc-800 flex items-center justify-between">
              <div className="flex items-center gap-2 text-zinc-900 dark:text-zinc-100">
                <div className="p-1.5 bg-indigo-600 rounded-md text-white shadow-sm"><Icon name="Brain" /></div>
                <h1 className="font-bold tracking-tight text-sm">KlusterFlow</h1>
              </div>
              <button onClick={() => setIsDark(!isDark)} className="p-2 text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors" title="Toggle Theme">
                <Icon name={isDark ? "Sun" : "Moon"} />
              </button>
            </div>
            
            <div className="flex-1 overflow-y-auto p-3 space-y-6">
              {Object.entries(CATEGORIES).map(([cat, styles]) => (
                <div key={cat}>
                  <div className="text-[10px] font-bold text-zinc-400 dark:text-zinc-500 uppercase tracking-widest mb-2 pl-2">{cat}</div>
                  <div className="space-y-1">
                    {TOOLBAR_ITEMS.filter(i => i.category === cat).map(item => (
                      <div 
                        key={item.type}
                        draggable
                        onDragStart={(e) => e.dataTransfer.setData('type', item.type)}
                        className="flex items-center p-2 rounded-md hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-grab active:cursor-grabbing group transition-all"
                      >
                        <div className={`p-1.5 rounded-md ${isDark ? styles.badge_dark : styles.badge_light} transition-colors`}>
                          <Icon name={item.iconName} size="text-sm" />
                        </div>
                        <span className="ml-3 text-xs font-semibold text-zinc-600 dark:text-zinc-300 group-hover:text-zinc-900 dark:group-hover:text-white">{item.label}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            
            <div className="p-4 border-t border-zinc-100 dark:border-zinc-800 text-[10px] text-zinc-400 text-center">
              Enterprise Build v2.4 (Lux)
            </div>
          </div>

          {/* CANVAS */}
          <div className="flex-1 relative bg-zinc-50 dark:bg-zinc-950">
            
            {/* TOOLBAR (Floating Pill) */}
            <div className="absolute top-4 right-4 z-50 animate-in slide-in-from-top-4 duration-500">
              <div className="glass px-1.5 py-1.5 rounded-full border border-zinc-200 dark:border-zinc-700 shadow-lg flex items-center gap-1 bg-white/90 dark:bg-zinc-800/90">
                
                <div className="px-3 flex items-center gap-2 text-xs font-semibold text-zinc-500 dark:text-zinc-400 border-r border-zinc-200 dark:border-zinc-700 pr-3 mr-1">
                  <Icon name={isSpacePressed ? "Hand" : "Cursor"} size="text-sm" />
                  <span>{isSpacePressed ? "Pan" : "Select"}</span>
                </div>

                <button 
                  onClick={downloadJSON} 
                  className="h-8 px-3 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 text-xs font-medium transition-colors flex items-center gap-2"
                  aria-label="Export JSON"
                >
                  <Icon name="FileJson" /> Export
                </button>
                
                <button 
                  onClick={downloadCode} 
                  className="h-8 px-4 rounded-full bg-zinc-900 dark:bg-zinc-100 hover:bg-zinc-800 dark:hover:bg-white text-white dark:text-zinc-900 text-xs font-medium shadow-sm transition-all flex items-center gap-2"
                  aria-label="Generate Python Code"
                >
                  <Icon name="Terminal" /> Code
                </button>
              </div>
            </div>

            <div 
              ref={canvasRef}
              className={`w-full h-full relative overflow-hidden ${isSpacePressed ? 'cursor-grab active:cursor-grabbing' : 'cursor-default'}`}
              onMouseDown={(e) => handleMouseDown(e, 'canvas')}
              onContextMenu={(e) => onContextMenu(e, 'canvas')}
              onDragOver={(e) => e.preventDefault()}
              onDrop={(e) => {
                 const type = e.dataTransfer.getData('type');
                 if (!type) return;
                 const rect = canvasRef.current.getBoundingClientRect();
                 const x = e.clientX - rect.left - viewOffset.x - 120;
                 const y = e.clientY - rect.top - viewOffset.y - 40;
                 setNodes(ns => [...ns, { id: generateId(), type, x, y, label: TOOLBAR_ITEMS.find(t=>t.type===type).label, data: { purpose: '' }}]);
              }}
            >
              {/* Background Pattern */}
              <div 
                className="absolute inset-0 pointer-events-none opacity-[0.4] dark:opacity-[0.2]"
                style={{ 
                  backgroundImage: `radial-gradient(${isDark ? '#52525b' : '#d4d4d8'} 1px, transparent 1px)`, 
                  backgroundSize: `${SNAP_GRID}px ${SNAP_GRID}px`,
                  backgroundPosition: `${viewOffset.x}px ${viewOffset.y}px`
                }} 
              />

              <div style={{ transform: `translate(${viewOffset.x}px, ${viewOffset.y}px)` }} className="w-full h-full relative">
                {/* Connections Layer */}
                <svg className="absolute top-0 left-0 w-full h-full overflow-visible pointer-events-none">
                  <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7" fill={isDark ? "#71717a" : "#a1a1aa"} />
                    </marker>
                  </defs>
                  {edges.map(e => <Connection key={e.id} {...e} nodes={nodes} isDark={isDark} />)}
                  
                  {/* Live Drag Line */}
                  {dragState.type === 'connection' && (
                    <path 
                      d={`M ${dragState.startX} ${dragState.startY} C ${dragState.startX + 50} ${dragState.startY}, ${dragState.currX - 50} ${dragState.currY}, ${dragState.currX} ${dragState.currY}`} 
                      fill="none" 
                      stroke={isDark ? "#818cf8" : "#4f46e5"} 
                      strokeWidth="2" 
                      strokeDasharray="5,5" 
                      className="animate-pulse"
                    />
                  )}
                </svg>

                {/* Nodes Layer */}
                {nodes.map(n => (
                  <NodeItem 
                    key={n.id} 
                    node={n} 
                    isSelected={selectedIds.has(n.id)}
                    onMouseDown={(e) => handleMouseDown(e, 'node', n.id)}
                    onContextMenu={(e) => onContextMenu(e, 'node', n.id)}
                    onHandleMouseDown={(e) => handleMouseDown(e, 'connection', n.id)}
                  />
                ))}
              </div>

              {/* Lasso Selection Box */}
              {selectionBox && (
                <div 
                  className="absolute border border-indigo-500 bg-indigo-500/10 pointer-events-none z-50"
                  style={{ left: selectionBox.x, top: selectionBox.y, width: selectionBox.w, height: selectionBox.h }}
                />
              )}
            </div>
          </div>

          {/* RIGHT SIDEBAR (Inspector) */}
          {selectedIds.size === 1 && (
            <div className="w-80 glass border-l border-zinc-200 dark:border-zinc-800 z-40 flex flex-col slide-in bg-white/80 dark:bg-zinc-900/80">
              {(() => {
                const node = nodes.find(n => n.id === Array.from(selectedIds)[0]);
                if (!node) return null;
                return (
                  <>
                    <div className="p-4 border-b border-zinc-100 dark:border-zinc-800 flex justify-between items-center">
                      <span className="font-bold text-zinc-900 dark:text-zinc-100 text-sm">Agent Properties</span>
                      <button onClick={() => setSelectedIds(new Set())} className="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200"><Icon name="X" /></button>
                    </div>
                    <div className="p-5 space-y-6 flex-1 overflow-y-auto">
                      <div>
                        <label className="text-xs font-bold text-zinc-400 dark:text-zinc-500 uppercase tracking-wider mb-2 block">Agent Name</label>
                        <input 
                          value={node.label} 
                          onChange={(e) => setNodes(ns => ns.map(n => n.id === node.id ? { ...n, label: e.target.value } : n))}
                          className="w-full px-3 py-2 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-zinc-900 dark:text-zinc-100" 
                        />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-zinc-400 dark:text-zinc-500 uppercase tracking-wider mb-2 block">Instructions</label>
                        <textarea 
                          value={node.data.purpose}
                          onChange={(e) => setNodes(ns => ns.map(n => n.id === node.id ? { ...n, data: { ...n.data, purpose: e.target.value } } : n))}
                          rows={8}
                          className="w-full px-3 py-2 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500/50 resize-none text-zinc-700 dark:text-zinc-300 font-mono"
                          placeholder="Enter system prompt..."
                        />
                      </div>
                      <div className="pt-4 border-t border-zinc-100 dark:border-zinc-800">
                         <button 
                           onClick={() => deleteNodes(new Set([node.id]))}
                           className="w-full py-2.5 bg-white dark:bg-zinc-900 border border-rose-200 dark:border-rose-900/50 text-rose-600 dark:text-rose-500 rounded-lg text-sm font-bold hover:bg-rose-50 dark:hover:bg-rose-900/20 transition-all flex items-center justify-center gap-2 shadow-sm"
                         >
                           <Icon name="Trash2" /> Delete Agent
                         </button>
                      </div>
                    </div>
                  </>
                );
              })()}
            </div>
          )}

          {/* CONTEXT MENU */}
          {contextMenu && (
             <ContextMenu 
               x={contextMenu.x} 
               y={contextMenu.y} 
               options={contextMenu.options} 
               onClose={() => setContextMenu(null)} 
             />
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
